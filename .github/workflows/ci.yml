name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.28.5'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node build.mjs
      - run: node --test tests/*.test.js
      - run: node scripts/check-built-artifacts.mjs
  dsh-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.2.1-rc.1', '0.2.1-rc.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.28.5'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node -e "require('fs').mkdirSync('.compat-runtime',{recursive:true});require('fs').writeFileSync('.compat-runtime/package.json',JSON.stringify({private:true}))"
      - run: pnpm --dir .compat-runtime add --ignore-scripts @deepseek-ai/dsh@${{ matrix.dsh }}
      - run: node scripts/check-dsh-compatibility.mjs .compat-runtime/node_modules/@deepseek-ai/dsh/package.json
