name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.28.5'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node build.mjs
      - run: node --test tests/*.test.js
      - run: git diff --exit-code -- client.js client-runtime.js host-v1.2.6.js
